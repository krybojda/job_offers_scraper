services:

  mysql:
    image: mysql:8.4
    container_name: jobs-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Europe/Warsaw

    volumes:
      - jobs_mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

    networks:
      - jobs-network


  scraper:
    build:
      context: ./scraper
    container_name: jobs-scraper
    restart: unless-stopped

    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Europe/Warsaw

    depends_on:
      mysql:
        condition: service_healthy

    volumes:
      - ./scraper:/app
      - jobs-scraper-state:/app/state

    networks:
      - jobs-network

    command: ["python", "scraper.py"]


  web:
    build:
      context: ./web
    container_name: jobs-web
    restart: unless-stopped

    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Europe/Warsaw

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "8090:80"

    volumes:
      - ./web:/var/www/html

    networks:
      - jobs-network


volumes:
  jobs_mysql_data:
  jobs-scraper-state:


networks:
  jobs-network:
    driver: bridge